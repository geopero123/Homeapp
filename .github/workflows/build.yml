name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Silk.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Silk.apk \
            --title "Silk (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Silk.apk on the phone and tap it to install."

      # Saves the build result to the ci-log branch so it can be read with plain git.
      - name: Save build log
        if: always()
        run: |
          RESULT="${{ job.status }}"
          mkdir /tmp/log && cp build.log /tmp/log/ 2>/dev/null || true
          echo "$RESULT ${GITHUB_SHA}" > /tmp/log/status.txt
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Build $RESULT for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-log
